name: ${COMPOSE_PROJECT_NAME:?Set the existing stack project name}

x-container-defaults: &container-defaults
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-fis-worker: &fis-worker
  <<: *container-defaults
  image: curlimages/curl:8.12.1
  # Older Compose versions need numeric ownership for environment-sourced secrets.
  user: "101:102"
  restart: unless-stopped
  mem_limit: 64m
  depends_on:
    backend:
      condition: service_healthy
  secrets: [fis_outbox_worker_token]
  entrypoint: ["sh", "-ec"]
  command:
    - |
      trap 'kill "$$child" 2>/dev/null || true; exit 0' TERM INT
      child=
      token=$$(cat /run/secrets/fis_outbox_worker_token)
      while true; do
        printf 'X-FIS-Worker-Token: %s\n' "$$token" |
          curl --fail --silent --show-error --connect-timeout 5 --max-time 300 \
          -H @- -H 'Content-Type: application/json' -d "$$WORKER_BODY" \
          "http://backend:8080/internal/fis-outbox/$$WORKER_ROUTE" &
        child=$$!
        wait "$$child" || true
        sleep "$$WORKER_INTERVAL" &
        child=$$!
        wait "$$child" || true
      done

services:
  postgres-db:
    <<: *container-defaults
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 2g
    image: postgres:18.6-alpine
    secrets: [postgres_password]
    restart: unless-stopped
    environment:
      POSTGRES_USER: encoredb_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: pallets
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrations:
    <<: *container-defaults
    mem_limit: 128m
    image: ${MIGRATIONS_IMAGE:?Set the migrations image for this release}
    secrets: [postgres_password]
    depends_on:
      postgres-db:
        condition: service_healthy

  backend:
    <<: *container-defaults
    mem_limit: 1g
    secrets: [fis_outbox_worker_token]
    image: ${BACKEND_IMAGE:?Set the backend image for this release}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    expose:
      - "8080"
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${LDAP_CA_CERT_HOST_PATH:?Set the absolute CA certificate path}
        target: /etc/ssl/certs/borgwarner-enterprise-root.pem
        read_only: true
        bind:
          create_host_path: false
    environment:
      PORT: 8080
      FIS_OUTBOX_WORKER_TOKEN_FILE: /run/secrets/fis_outbox_worker_token
      PALLETS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      LDAP_URL: ${LDAP_URL:?Set LDAP_URL}
      LDAP_LOGIN_DOMAIN: ${LDAP_LOGIN_DOMAIN:?Set LDAP_LOGIN_DOMAIN}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE:?Set LDAP_SEARCH_BASE}
      LDAP_TIMEOUT_MS: ${LDAP_TIMEOUT_MS:?Set LDAP_TIMEOUT_MS}
      LDAP_CONNECT_TIMEOUT_MS: ${LDAP_CONNECT_TIMEOUT_MS:?Set LDAP_CONNECT_TIMEOUT_MS}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:?Set LDAP_TLS_REJECT_UNAUTHORIZED}
      LDAP_TLS_ALLOW_LEGACY_SERVER_CERT: ${LDAP_TLS_ALLOW_LEGACY_SERVER_CERT:-false}
      LDAP_TLS_SKIP_HOSTNAME_VERIFICATION: ${LDAP_TLS_SKIP_HOSTNAME_VERIFICATION:-true}
      LDAP_CA_CERT_PATH: /etc/ssl/certs/borgwarner-enterprise-root.pem
      APACS_DB_SERVER: ${APACS_DB_SERVER:-}
      APACS_DB_PORT: ${APACS_DB_PORT:-1433}
      APACS_DB_NAME: ${APACS_DB_NAME:-APACS}
      APACS_DB_USER: ${APACS_DB_USER:-}
      APACS_DB_PASSWORD: ${APACS_DB_PASSWORD:-}
      APACS_DB_ENCRYPT: ${APACS_DB_ENCRYPT:-true}
      APACS_DB_TRUST_CERTIFICATE: ${APACS_DB_TRUST_CERTIFICATE:-false}
      APACS_DB_CONNECTION_TIMEOUT_MS: ${APACS_DB_CONNECTION_TIMEOUT_MS:-5000}
      APACS_DB_REQUEST_TIMEOUT_MS: ${APACS_DB_REQUEST_TIMEOUT_MS:-5000}
      AUTH_SESSION_TTL_MINUTES: ${AUTH_SESSION_TTL_MINUTES:-720}
      FIS_UR_GROUP: ${FIS_UR_GROUP:-Maintenance}
      FIS_ME_GROUP: ${FIS_ME_GROUP:-proceng}
      FIS_STRAIN_BLOCKING: ${FIS_STRAIN_BLOCKING:-false}
      FIS1_ROUTER_URL: ${FIS1_ROUTER_URL:?Set FIS1_ROUTER_URL}
      FIS2_ROUTER_URL: ${FIS2_ROUTER_URL:?Set FIS2_ROUTER_URL}
      FIS_REQUEST_TIMEOUT_MS: ${FIS_REQUEST_TIMEOUT_MS:-10000}
      FIS_OUTBOX_COMPLETED_RETENTION_DAYS: ${FIS_OUTBOX_COMPLETED_RETENTION_DAYS:-30}
      ENCORE_ENV: production

  frontend:
    <<: *container-defaults
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    mem_limit: 128m
    image: ${FRONTEND_IMAGE:?Set the frontend image for this release}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-8082}:80"
      - "${FIS_INGRESS_PORT:-4000}:4000"
    depends_on:
      backend:
        condition: service_healthy

  fis-outbox-worker:
    <<: *fis-worker
    environment:
      WORKER_ROUTE: process
      WORKER_BODY: '{"limit":20}'
      WORKER_INTERVAL: 5

  fis-reconciler:
    <<: *fis-worker
    environment:
      WORKER_ROUTE: reconcile
      WORKER_BODY: '{}'
      WORKER_INTERVAL: 900

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  fis_outbox_worker_token:
    environment: FIS_OUTBOX_WORKER_TOKEN

volumes:
  pgdata:
    external: true
    name: ${POSTGRES_VOLUME:?Set the existing PostgreSQL volume name}
