<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" />
    <script>try{const s=localStorage.getItem('palletx-theme'),t=s==='light'||s==='system'?s:'dark',l=t==='light'||(t==='system'&&!matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.themePreference=t;document.documentElement.dataset.theme=l?'light':'dark';if(l)document.querySelector('meta[name="theme-color"]').content='#f3f5fa'}catch{}</script>
    <meta name="description" content="PalletX — soldering pallet management system." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PalletX</title>
  </head>

    <div id="root"></div>

  </body>
