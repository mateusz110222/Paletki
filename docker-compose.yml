services:
  postgres-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: encoredb_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pallets
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrations:
    image: migrate/migrate
    volumes:
      - ./backend/pallet/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://encoredb_user:${POSTGRES_PASSWORD}@postgres-db:5432/pallets?sslmode=disable
      - up
    depends_on:
      postgres-db:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE}
    expose:
      - "8080"
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    volumes:
      - ./backend/certs/borgwarner-enterprise-root.pem:/etc/ssl/certs/borgwarner-enterprise-root.pem:ro
    environment:
      PORT: 8080
      PALLETS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      LDAP_URL: ${LDAP_URL}
      LDAP_LOGIN_DOMAIN: ${LDAP_LOGIN_DOMAIN}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE}
      LDAP_IT_DEPARTMENTS: ${LDAP_IT_DEPARTMENTS}
      LDAP_UR_DEPARTMENTS: ${LDAP_UR_DEPARTMENTS:-}
      LDAP_ME_DEPARTMENTS: ${LDAP_ME_DEPARTMENTS:-}
      LDAP_LOOKUP_BIND_USER: ${LDAP_LOOKUP_BIND_USER:-}
      LDAP_LOOKUP_BIND_PASSWORD: ${LDAP_LOOKUP_BIND_PASSWORD:-}
      LDAP_TIMEOUT_MS: ${LDAP_TIMEOUT_MS}
      LDAP_CONNECT_TIMEOUT_MS: ${LDAP_CONNECT_TIMEOUT_MS}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED}
      LDAP_TLS_ALLOW_LEGACY_SERVER_CERT: ${LDAP_TLS_ALLOW_LEGACY_SERVER_CERT:-false}
      LDAP_TLS_SKIP_HOSTNAME_VERIFICATION: ${LDAP_TLS_SKIP_HOSTNAME_VERIFICATION:-true}
      LDAP_CA_CERT_PATH: /etc/ssl/certs/borgwarner-enterprise-root.pem
      AUTH_SESSION_TTL_MINUTES: ${AUTH_SESSION_TTL_MINUTES:-720}
      FIS1_ROUTER_URL: ${FIS1_ROUTER_URL}
      FIS2_ROUTER_URL: ${FIS2_ROUTER_URL}
      FIS_REQUEST_TIMEOUT_MS: ${FIS_REQUEST_TIMEOUT_MS:-10000}
      ENCORE_ENV: ${ENCORE_ENV}

  frontend:
    image: nginx:alpine
    ports:
      - "${FRONTEND_HTTP_PORT:-8082}:80"
      - "${FIS_INGRESS_PORT:-4000}:4000"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  fis-outbox-worker:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    depends_on:
      - backend
    entrypoint: ["sh", "-c"]
    command:
      - >-
        while true; do curl --fail --silent --show-error --retry 5 --retry-connrefused -X POST -H 'Content-Type: application/json' -d '{"limit":20}' http://backend:8080/internal/fis-outbox/process || true; sleep 5; done

  fis-reconciler:
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    depends_on:
      - backend
    entrypoint: ["sh", "-c"]
    command:
      - >-
        while true; do curl --fail --silent --show-error --retry 5 --retry-connrefused -X POST -H 'Content-Type: application/json' -d '{}' http://backend:8080/internal/fis-outbox/reconcile || true; sleep 900; done

volumes:
  pgdata:
