services:
  postgres-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrations:
    image: migrate/migrate
    volumes:
      - /opt/paletki/backend/pallet/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/${POSTGRES_DB}?sslmode=disable
      - up
    depends_on:
      postgres-db:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE}
    ports:
      - "${BACKEND_PORT}:4000"
    depends_on:
      db-migrations:
        condition: service_completed_successfully
    volumes:
      - ./backend/certs/borgwarner-enterprise-root.pem:/etc/ssl/certs/borgwarner-enterprise-root.pem:ro
    environment:
      PALLETS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      LDAP_URL: ${LDAP_URL}
      LDAP_LOGIN_DOMAIN: ${LDAP_LOGIN_DOMAIN}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE}
      LDAP_IT_DEPARTMENTS: ${LDAP_IT_DEPARTMENTS}
      LDAP_TIMEOUT_MS: ${LDAP_TIMEOUT_MS}
      LDAP_CONNECT_TIMEOUT_MS: ${LDAP_CONNECT_TIMEOUT_MS}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED}
      LDAP_TLS_ALLOW_LEGACY_SERVER_CERT: ${LDAP_TLS_ALLOW_LEGACY_SERVER_CERT:-false}
      LDAP_CA_CERT_PATH: /etc/ssl/certs/borgwarner-enterprise-root.pem
      AUTH_SESSION_TTL_MINUTES: ${AUTH_SESSION_TTL_MINUTES:-720}
      FIS1_ROUTER_URL: ${FIS1_ROUTER_URL}
      FIS2_ROUTER_URL: ${FIS2_ROUTER_URL}
      FIS_REQUEST_TIMEOUT_MS: ${FIS_REQUEST_TIMEOUT_MS:-10000}
      ENCORE_ENV: ${ENCORE_ENV}

  frontend:
    image: nginx:alpine
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
