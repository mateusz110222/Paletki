limit_req_zone $binary_remote_addr zone=ldap_login:10m rate=5r/m;
server_tokens off;
client_max_body_size 1m;
gzip on;
gzip_types application/javascript application/json image/svg+xml text/css;
proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;

# The original URI survives an internal redirect to the SPA entry point.
map $request_uri $palletx_frame_policy {
    default "frame-ancestors 'none'";
    ~^/(dashboard|live)(\?|$) "frame-ancestors *";
}
map $request_uri $palletx_frame_options {
    default DENY;
    ~^/(dashboard|live)(\?|$) "";
}
map $uri $palletx_cache_control {
    default "";
    /index.html "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

# Dedicated integration ingress. This port intentionally exposes only the FIS
# API surface to production stations; every other Encore route is rejected.
server {
    listen 4000;
    server_name _;

    location = /fis {
        return 308 /fis/;
    }

    location ^~ /fis/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options $palletx_frame_options always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-72Dn68TfamIEHiw1SLsT7MmKV3JcyycmtcQJvnw3LVg='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; $palletx_frame_policy" always;
    add_header Cache-Control $palletx_cache_control always;

    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://backend:8080;
    }

    location ^~ /internal/ {
        return 404;
    }

    location = /auth/login {
        limit_req zone=ldap_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /auth/card-login {
        limit_req zone=ldap_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location ~ ^/(pallets|projects|models|defects|operator-reports|auth|fis|public)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    location = /dashboard/ {
        return 308 /dashboard;
    }

    location = /live/ {
        return 308 /live;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
