name: CI / CD

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paletki-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Encore wrappers
        run: |
          curl --fail --silent --show-error --location https://encore.dev/install.sh -o "$RUNNER_TEMP/install-encore.sh"
          bash "$RUNNER_TEMP/install-encore.sh" "$(node -p "require('./node_modules/encore.dev/package.json').version")"
          # pnpm hoists dependencies to the workspace root. Encore checks the app directory.
          mkdir -p backend/node_modules
          (cd backend && "$HOME/.encore/bin/encore" gen wrappers)
      - run: pnpm check
      - run: pnpm test:postgres
      - name: Check deployment configuration
        run: |
          bash -n deploy/deploy.sh
          node --test deploy/deployment.test.mjs

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.images.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Encore CLI
        run: |
          curl --fail --silent --show-error --location https://encore.dev/install.sh -o /tmp/install-encore.sh
          bash /tmp/install-encore.sh "$(node -p "require('./node_modules/encore.dev/package.json').version")"
          mkdir -p backend/node_modules
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Authenticate Encore (linked applications only)
        env:
          ENCORE_AUTH_KEY: ${{ secrets.ENCORE_AUTH_KEY }}
        run: |
          if [ -n "$ENCORE_AUTH_KEY" ]; then
            "$HOME/.encore/bin/encore" auth login --auth-key="$ENCORE_AUTH_KEY"
          fi
      - name: Image names
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Build release images
        env:
          IMAGE_PREFIX: ${{ steps.images.outputs.prefix }}
          RELEASE_SHA: ${{ github.sha }}
          # These URLs are public browser configuration, never credentials.
          FIS1_UNIT_HISTORY_URL: ${{ vars.FIS1_UNIT_HISTORY_URL }}
          FIS2_UNIT_HISTORY_URL: ${{ vars.FIS2_UNIT_HISTORY_URL }}
          VITE_PROD_API_BASE_URL: ''
        run: |
          pnpm build
          (cd backend && encore build docker --config infra.config.json --base=node:24-bookworm-slim "$IMAGE_PREFIX/backend:$RELEASE_SHA")
          source_label="org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          docker build --label "$source_label" -f deploy/frontend.Dockerfile -t "$IMAGE_PREFIX/frontend:$RELEASE_SHA" .
          docker build --label "$source_label" -f deploy/migrations.Dockerfile -t "$IMAGE_PREFIX/migrations:$RELEASE_SHA" .
          for service in backend frontend migrations; do
            docker push "$IMAGE_PREFIX/$service:$RELEASE_SHA"
          done

  deploy:
    if: vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: publish
    runs-on: [self-hosted, linux, x64, paletki-production]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.prefix }}/backend:${{ github.sha }}
          FRONTEND_IMAGE: ${{ needs.publish.outputs.prefix }}/frontend:${{ github.sha }}
          MIGRATIONS_IMAGE: ${{ needs.publish.outputs.prefix }}/migrations:${{ github.sha }}
        run: |
          export DOCKER_CONFIG
          DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          bash deploy/deploy.sh
